name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.1"

jobs:
  app:
    name: App – analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatting (generated l10n excluded)
        run: dart format --output=none --set-exit-if-changed lib/app.dart lib/main.dart lib/core lib/data lib/services lib/state lib/ui test
      - run: flutter analyze
      - run: flutter test

  server:
    name: Server – generator & Asterisk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Generator unit tests
        working-directory: server
        run: python -m unittest discover -s generator -v
      - name: Boot Asterisk with the example configuration
        run: bash server/tests/validate_asterisk.sh

  android:
    name: Build Android APK
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: haustelefon-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows app
    needs: app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: haustelefon-windows
          path: build/windows/x64/runner/Release/
