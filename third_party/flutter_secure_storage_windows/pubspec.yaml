name: flutter_secure_storage_windows
description: >-
  Haustelefon-Variante von flutter_secure_storage_windows 4.2.2 ohne nativen
  C++-Teil (braucht kein Visual-Studio-ATL). Speichert per DPAPI (Dart FFI).
repository: https://github.com/mogol/flutter_secure_storage
version: 4.2.2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.2
  win32: ^6.0.1

flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      windows:
        dartPluginClass: FlutterSecureStorageWindows
